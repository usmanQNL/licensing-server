name: dco

on:
  pull_request:

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit has a Signed-off-by line from its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email="$(git log -1 --format='%ae' "$c")"
            if ! git log -1 --format='%B' "$c" | grep -i '^Signed-off-by: ' | grep -qiF "<$email>"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no 'Signed-off-by' line for its author <$email>."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fix it with 'git rebase --signoff $BASE' and force-push. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off."
