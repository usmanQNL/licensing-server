[package]
name = "license-gate-server"
version = "0.1.0"
edition = "2021"

[dependencies]
license-samples = { path = ".." }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
